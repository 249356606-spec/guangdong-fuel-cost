        //向cookie写入数据  
        function writeCookie(name, value, days) {
            // 定义有效日期（cookie的有效时间）  
            var expires = "";

            // 为有效日期赋值  
            if (days) {
                var date = new Date();
                //设置有效期（当前时间+时间段）  
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000)); //时间段为毫秒数   
                expires = "; expires=" + date.toGMTString();
            }

            // 给cookie赋值 name, value和expiration date（有效期）  
            document.cookie = name + "=" + value + expires + "; path=/";
        }
        //读取cookie数据
        function readCookie(name) {
            var searchName = name + "=";
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i];
                while (c.charAt(0) == ' ')
                    c = c.substring(1, c.length);
                if (c.indexOf(searchName) == 0)
                    return c.substring(searchName.length, c.length);
            }
            return null;
        }
        //清楚所有的cookie  
        function eraseCookie(name) {
            // 将时间设置成-1将清除存储在cookie中的数据  
            writeCookie(name, "", -1);
        }

        function encryptText(plaintext) {
            const encryptedText = CryptoJS.AES.encrypt(plaintext, CryptoJS.enc.Utf8.parse("123456789abcdefg"),
                {
                    iv: CryptoJS.enc.Latin1.parse("123456789abcdefg"),
                    mode: CryptoJS.mode.ECB,
                    padding: CryptoJS.pad.Pkcs7
                }).toString();
             return encryptedText;
